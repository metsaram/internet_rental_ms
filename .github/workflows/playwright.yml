name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./db/test.db"
      NEXTAUTH_SECRET: "netrent-ci-secret-32-chars-minimum-token"
      NEXTAUTH_URL: "http://localhost:3000"
      CI: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare database and demo seed
        run: |
          bun run db:push
          bun run db:seed

      - name: Install Playwright Browsers & OS Dependencies
        run: bunx playwright install --with-deps

      - name: Run code linter
        run: bun run lint

      - name: Run unit & component tests
        run: bun run test:run

      - name: Run Playwright E2E tests
        run: bun run test:e2e

      - name: Upload Playwright HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Test Traces
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/**/*.zip
          retention-days: 14

      - name: Upload Failure Screenshots & Videos
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure-artifacts
          path: |
            test-results/**/*.png
            test-results/**/*.webm
          retention-days: 14
